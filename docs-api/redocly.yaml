# Redocly configuration
# Docs: https://redocly.com/docs/cli/configuration
#
# `main` is the API served by `npm run preview` (Redoc live preview) and
# linted by `npm run lint`.
apis:
  main:
    root: tsp-output/schema/openapi.yaml

# Lint ruleset applied by `npm run lint`.
# Use `recommended` for stricter checks (requires summaries, security, etc.).
extends:
  - minimal

# Disable the preview's MCP server / "Connect to Cursor|VS Code" buttons.
mcp:
  hide: true
